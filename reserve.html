<!doctype html>
<html lang="en">
<head>
  <title>Reserve — ellen cafe &amp; eatery</title>
  <meta name="description" content="Request a table at ellen cafe &amp; eatery, Alexandria.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23f3efe4%27/%3E%3Ctext x=%2732%27 y=%2747%27 font-family=%27Helvetica,Arial,sans-serif%27 font-weight=%27700%27 font-size=%2746%27 text-anchor=%27middle%27 fill=%27%23703223%27%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="index.html" aria-label="ellen — home">ellen</a>
      <ul>
        <li><a href="index.html#menu">menu</a></li>
        <li><a href="index.html#visit">visit</a></li>
        <li><a href="reserve.html" aria-current="page">reserve</a></li>
      </ul>
    </nav>

    <main class="reserve">
      <div id="form-view">
        <div class="label">reservations</div>
        <h1>reserve a table</h1>
        <p data-cafe="reserveIntro"></p>

        <form id="reserve-form" novalidate>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="field">
            <label for="time">Time</label>
            <select id="time" name="time" required disabled>
              <option value="">Choose a date first</option>
            </select>
          </div>
          <div class="field full"><p class="hint" id="date-hint" aria-live="polite"></p></div>
          <div class="field">
            <label for="party">Guests</label>
            <select id="party" name="party" required></select>
          </div>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="100" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
          </div>
          <div class="field">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="30">
          </div>
          <div class="field full">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="2" maxlength="500"></textarea>
          </div>
          <div class="actions">
            <button class="btn" type="submit" id="submit">request reservation</button>
            <p class="error" role="alert"><span id="error"></span> <a class="link" id="email-instead" hidden>Send it by email instead</a></p>
          </div>
        </form>
      </div>

      <div id="done-view" hidden>
        <div class="label">reservations</div>
        <h1 id="done-title" tabindex="-1">thank you.</h1>
        <p id="done-text"></p>
        <dl class="summary" id="summary"></dl>
        <a class="btn ghost" href="index.html">back to home</a>
      </div>
    </main>

    <footer>
      <span>© <span id="year"></span> <span data-cafe="name">ellen cafe &amp; eatery</span></span>
      <a class="link" id="ig" target="_blank" rel="noopener"></a>
    </footer>
  </div>
  <script src="assets/config.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/reserve.js"></script>
</body>
</html>
