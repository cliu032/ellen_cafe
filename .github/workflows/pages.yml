name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/bold-goodall-qtbk6b"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html reserve.html admin.html assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # A separate job, so the uploaded site is registered before it is asked for.
  # GitHub Pages accepts a deployment only from the branch its "github-pages" environment
  # allows, which is the repository's default branch unless that setting is changed. Pushes to
  # any other branch listed above are built (to check the site assembles) but not deployed.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
